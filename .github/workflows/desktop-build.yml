name: Build Desktop

# Windows x64-only, speed-focused desktop build. Produces a self-contained NSIS
# installer (desktop app + built-in Lumiverse server) as a workflow artifact.
# Unsigned for updates: no updater key exists on this fork. Tests, validation, and non-Windows targets are omitted;
# run upstream's full desktop-build.yml for those.
on:
  push:
    branches: [windows-desktop-build-fast]
    paths:
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fast release profile: skip fat LTO and single-codegen-unit optimisation,
  # which dominate Rust compile time. The app behaves the same; the binary is
  # somewhat larger.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Desktop (x86_64-pc-windows-msvc)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Shared with main's desktop-cache-keepwarm.yml, which keeps it alive.
          shared-key: win-desktop
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        shell: bash
        run: |
          bun install --frozen-lockfile
          (cd frontend && bun install --frozen-lockfile)
          (cd desktop && bun install --frozen-lockfile)

      - name: Build the standalone Lumiverse server
        run: bun run build:server

      - name: Stage the server inside the desktop app
        run: bun run build:desktop-server --reuse-server --stage-only

      - name: Build self-contained NSIS installer
        working-directory: desktop
        run: bun run tauri build --config src-tauri/tauri.server-bundle.conf.json --bundles nsis --ci -- --locked

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-x86_64-pc-windows-msvc
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
